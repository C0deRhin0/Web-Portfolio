name: Update portfolio GitHub activity

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-github-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh public contribution data
        run: node scripts/update-github-activity.mjs

      - name: Commit changed activity data
        run: |
          if git diff --quiet -- src/data/githubActivity.json; then
            echo "Contribution data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/githubActivity.json
          git commit -m "chore: refresh portfolio GitHub activity"
          git push origin main
